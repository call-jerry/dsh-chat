# dsh-chat-deepseek bundle patch: inserts the DeepSeek Chat plugin row into the
# web profile. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base. Activate with:
#   dsh plugin --profile <name> add link:<path-to-this-checkout>
#
# The row is a bare plugin by package name: the node half (exports ".")
# runs in the host process (the local reverse proxy), and the `dsh.client`
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: chat-deepseek
      name: 'dsh-chat-deepseek'
